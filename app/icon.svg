<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AgriPak">
  <!-- Pakistan flag green rounded tile -->
  <rect width="64" height="64" rx="14" fill="#01411C"/>
