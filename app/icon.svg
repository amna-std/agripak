  <path d="M32 33c-9.5 0-15-5-15-13 8.5-1.5 15 3 15 13Z" fill="#4ADE80"/>
  <path d="M32 37c8 0 13-4.5 13-11.5-7.5-1.2-13 2.8-13 11.5Z" fill="#86EFAC"/>
</svg>
